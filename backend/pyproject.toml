[project]
name = "performance-review-backend"
version = "0.1.0"
description = "Emids Annual Performance Review — backend service"
requires-python = ">=3.12"
dependencies = [
    # Web layer — pinned to latest stable at setup time; upgrades are deliberate (per CLAUDE.md).
    "fastapi==0.129.0",
    "uvicorn[standard]>=0.38.0,<0.39",
    # Validation / settings
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.7,<3",
    # multipart/form-data parsing for file uploads
    "python-multipart==0.0.34",
    # Persistence
    "sqlalchemy[asyncio]==2.0.44",
    "asyncpg>=0.31,<1",
    "alembic==1.17.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "httpx>=0.28,<1",
    "pytest-asyncio>=1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"