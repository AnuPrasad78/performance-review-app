name: Deploy to Azure Container Apps

# Manual, per environment. Release order (docs/deployment.md):
#   foundation → build images → migration job (wait) → roll api + web
# A failed migration stops the release before any app serves the new code.
#
# Required GitHub environment configuration (Settings → Environments → <name>):
#   vars:    AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#            AZURE_RESOURCE_GROUP, AZURE_LOCATION, APP_ENVIRONMENT (dev|prod),
#            ADMIN_EMAILS (JSON array, e.g. ["hr.admin@emids.com"]),
#            ENTRA_TENANT_ID, ENTRA_CLIENT_ID (SSO; required for APP_ENVIRONMENT=prod)
#   secrets: POSTGRES_ADMIN_PASSWORD, ENTRA_CLIENT_SECRET, SESSION_SECRET
# The client id is a federated (OIDC) credential — no stored Azure secret.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy (holds the Azure settings)
        required: true
        default: prod
      mode:
        description: >-
          release = build, migrate, roll. app-rollback = point api + web back at
          the images of the commit this run is started from (pick that commit
          or tag in "Use workflow from"); no build and no migration, because an
          older image cannot migrate a newer schema. See docs/deployment.md.
        type: choice
        options: [release, app-rollback]
        default: release

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      TAG: ${{ github.sha }}
      # Parameters every Bicep pass shares. Passed through the environment, not
      # interpolated into scripts, so values are never parsed as shell.
      ENVIRONMENT_NAME: ${{ inputs.environment }}
      APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Refuse prod without SSO
        if: vars.APP_ENVIRONMENT == 'prod'
        run: |
          for name in ENTRA_TENANT_ID ENTRA_CLIENT_ID ENTRA_CLIENT_SECRET SESSION_SECRET; do
            [ -n "${!name}" ] || { echo "::error::$name is required when APP_ENVIRONMENT=prod (the API will not boot without SSO)"; exit 1; }
          done

      - name: Ensure resource group
        run: az group create --name "$RG" --location "${{ vars.AZURE_LOCATION }}" --output none

      - name: "1/4 Foundation (network, registry, vault, database, environment)"
        id: foundation
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RG" \
            --name "foundation-$TAG" \
            --template-file infra/main.bicep \
            --parameters \
                         environmentName="$ENVIRONMENT_NAME" \
                         appEnvironment="$APP_ENVIRONMENT" \
                         adminEmails="$ADMIN_EMAILS" \
                         entraTenantId="$ENTRA_TENANT_ID" \
                         entraClientId="$ENTRA_CLIENT_ID" \
                         entraClientSecret="$ENTRA_CLIENT_SECRET" \
                         sessionSecret="$SESSION_SECRET" \
                         postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
            --query properties.outputs --output json)
          echo "registry=$(jq -r .registryName.value <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "job=$(jq -r .migrateJobName.value <<<"$outputs")" >> "$GITHUB_OUTPUT"

      - name: "2/4 Build and push images (immutable tag = commit SHA)"
        if: inputs.mode == 'release'
        run: |
          az acr build --registry "${{ steps.foundation.outputs.registry }}" \
            --image "performance-review-api:$TAG" backend
          az acr build --registry "${{ steps.foundation.outputs.registry }}" \
            --image "performance-review-web:$TAG" frontend

      - name: "3/4 Migrate the database"
        if: inputs.mode == 'release'
        run: |
          az deployment group create \
            --resource-group "$RG" \
            --name "migrate-$TAG" \
            --template-file infra/main.bicep \
            --parameters \
                         environmentName="$ENVIRONMENT_NAME" \
                         appEnvironment="$APP_ENVIRONMENT" \
                         adminEmails="$ADMIN_EMAILS" \
                         entraTenantId="$ENTRA_TENANT_ID" \
                         entraClientId="$ENTRA_CLIENT_ID" \
                         entraClientSecret="$ENTRA_CLIENT_SECRET" \
                         sessionSecret="$SESSION_SECRET" \
                         postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
                         releaseTag="$TAG" deployApps=false \
            --output none
          job='${{ steps.foundation.outputs.job }}'
          execution=$(az containerapp job start --name "$job" --resource-group "$RG" --query name --output tsv)
          echo "Started $execution"
          for _ in $(seq 1 120); do
            status=$(az containerapp job execution show --name "$job" --resource-group "$RG" \
              --job-execution-name "$execution" --query properties.status --output tsv)
            echo "Migration: $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded)
                echo "::error::Migration $execution ended $status — apps were NOT rolled. See the job's logs in Log Analytics."
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Migration $execution did not finish in 30 minutes"
          exit 1

      - name: "4/4 Roll api and web"
        run: |
          for image in performance-review-api performance-review-web; do
            az acr repository show --name "${{ steps.foundation.outputs.registry }}" \
              --image "$image:$TAG" --output none \
              || { echo "::error::$image:$TAG is not in the registry — release it first"; exit 1; }
          done
          az deployment group create \
            --resource-group "$RG" \
            --name "apps-$TAG" \
            --template-file infra/main.bicep \
            --parameters \
                         environmentName="$ENVIRONMENT_NAME" \
                         appEnvironment="$APP_ENVIRONMENT" \
                         adminEmails="$ADMIN_EMAILS" \
                         entraTenantId="$ENTRA_TENANT_ID" \
                         entraClientId="$ENTRA_CLIENT_ID" \
                         entraClientSecret="$ENTRA_CLIENT_SECRET" \
                         sessionSecret="$SESSION_SECRET" \
                         postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
                         releaseTag="$TAG" deployApps=true \
            --query properties.outputs.webUrl.value --output tsv
